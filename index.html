function safeParseJSON(raw){
  // 1. 코드블록 제거
  var clean = raw.replace(/```json|```/g,"").trim();
  // 2. JSON 객체 추출
  var m = clean.match(/\{[\s\S]*\}/);
  var str = m ? m[0] : clean;
  // 3. 제어문자 제거, trailing comma 제거
  str = str.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g," ").replace(/,\s*([}\]])/g,"$1");
  // 4. 직접 파싱 시도
  try{ return JSON.parse(str); }catch(e1){}
  // 5. 문자열 값 안의 따옴표/개행을 이스케이프해서 재시도
  // JSON 문자열 값(" ... ") 안의 내용을 안전하게 처리
  try{
    var fixed = str.replace(/"((?:[^"\\]|\\.)*)"/g, function(match){
      // 이미 올바른 JSON 문자열이면 그대로, 아니면 내부 따옴표 이스케이프
      try{ JSON.parse(match); return match; }
      catch(e){
        var inner = match.slice(1,-1)
          .replace(/\\/g,"\\\\")
          .replace(/"/g,'\\"')
          .replace(/\n/g,"\\n")
          .replace(/\r/g,"\\r");
        return '"'+inner+'"';
      }
    });
    return JSON.parse(fixed);
  }catch(e2){}
  // 6. 키에 따옴표 없는 경우 보정
  try{
    var strict = str.replace(/([{,]\s*)([a-zA-Z_]\w*)(\s*):/g,'$1"$2"$3:');
    return JSON.parse(strict);
  }catch(e3){}
  // 7. 정규식으로 각 필드를 직접 추출 (최후 수단)
  var result = {};
  var fields = ["stt","score","missed","advice","phonetics_good","phonetics_weak","level","praise","improve","good_phonemes","weak_phonemes"];
  fields.forEach(function(key){
    // 숫자 값
    var numMatch = str.match(new RegExp('"'+key+'"\\s*:\\s*(-?\\d+)'));
    if(numMatch){ result[key] = parseInt(numMatch[1]); return; }
    // 문자열 값 — 닫는 따옴표를 찾기 어려우면 콤마/중괄호 앞까지 추출
    var strMatch = str.match(new RegExp('"'+key+'"\\s*:\\s*"([^"]*)"'));
    if(strMatch){ result[key] = strMatch[1]; }
  });
  if(Object.keys(result).length > 0) return result;
  throw new Error("JSON 파싱 완전 실패: "+str.slice(0,80));
}

// PCM L16 → WAV 변환 (Gemini TTS 출력 포맷)
function pcmToWav(pcmBase64, sampleRate){
  sampleRate = sampleRate || 24000;
  var pcmBytes = atob(pcmBase64);
  var pcmLen = pcmBytes.length;
  var buf = new ArrayBuffer(44 + pcmLen);
  var view = new DataView(buf);
  function writeStr(offset, str){ for(var i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); }
  writeStr(0,"RIFF");
  view.setUint32(4, 36+pcmLen, true);
  writeStr(8,"WAVE");
  writeStr(12,"fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);   // PCM
  view.setUint16(22, 1, true);   // mono
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate*2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeStr(36,"data");
  view.setUint32(40, pcmLen, true);
  for(var i=0;i<pcmLen;i++) view.setUint8(44+i, pcmBytes.charCodeAt(i));
  return new Blob([buf], {type:"audio/wav"});
}

// ── Gemini TTS (피드백/리포트 읽기용 — S6 Lite만, 그 외는 Web Speech) ─────────
var ttsCache = {};
var ttsFetching = {};
var ttsCacheListeners = {};

function onTTSReady(text, cb){
  if(ttsCache[text]){ cb(); return function(){}; }
  if(!ttsCacheListeners[text]) ttsCacheListeners[text]=[];
  ttsCacheListeners[text].push(cb);
  return function(){
    if(ttsCacheListeners[text]) ttsCacheListeners[text]=ttsCacheListeners[text].filter(function(f){return f!==cb;});
  };
}
function notifyTTSReady(text){
  if(!ttsCacheListeners[text]) return;
  ttsCacheListeners[text].forEach(function(cb){ try{cb();}catch(e){} });
  delete ttsCacheListeners[text];
}

async function fetchTTSBlob(text){
  var ttsUrl = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key="+GEMINI_API_KEY;
  var body = {
    contents:[{parts:[{text:text}]}],
    generationConfig:{
      responseModalities:["AUDIO"],
      speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:"Kore"}}}
    }
  };
  var resp = await fetch(ttsUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!resp.ok) throw new Error("TTS HTTP "+resp.status);
  var data = await resp.json();
  var part = data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts[0];
  if(part&&part.inlineData&&part.inlineData.data) return pcmToWav(part.inlineData.data, 24000);
  throw new Error("TTS 오디오 없음");
}

// Web Speech 직접 호출 (내부 폴백용 — 순환 참조 방지)
function webSpeechTTS(text, rate, resolve){
  try{
    window.speechSynthesis.cancel();
    setTimeout(function(){
      var u = new SpeechSynthesisUtterance(text);
      u.lang="ko-KR"; u.rate=rate||0.85; u.pitch=1.1; u.volume=1;
      var voices=window.speechSynthesis.getVoices();
      var kr=voices.find(function(v){return v.lang==="ko-KR"||v.lang==="ko";});
      if(kr) u.voice=kr;
      u.onend=function(){resolve();}; u.onerror=function(){resolve();};
      window.speechSynthesis.speak(u);
      setTimeout(resolve, 6000);
    }, 30);
  }catch(e){ resolve(); }
}

// 피드백 텍스트 읽기 — S6 Lite: Gemini TTS, 그 외: Web Speech
async function speakFeedback(text, rate){
  rate = rate||0.85;
  // S6 Lite가 아니거나 API 키 없으면 Web Speech
  if(!IS_S6_LITE || !GEMINI_API_KEY){
    return new Promise(function(resolve){ webSpeechTTS(text, rate, resolve); });
  }
  // S6 Lite: Gemini TTS
  try{
    if(!ttsCache[text]){
      if(ttsFetching[text]){ await ttsFetching[text]; }
      else {
        ttsFetching[text] = fetchTTSBlob(text)
          .then(function(b){ ttsCache[text]=b; notifyTTSReady(text); })
          .catch(function(){})
          .finally(function(){ delete ttsFetching[text]; });
        await ttsFetching[text];
      }
    }
    if(ttsCache[text]){
      return new Promise(function(resolve){
        var url = URL.createObjectURL(ttsCache[text]);
        var audio = new Audio(url);
        audio.playbackRate = rate;
        audio.onended = function(){ URL.revokeObjectURL(url); resolve(); };
        audio.onerror = function(){ URL.revokeObjectURL(url); webSpeechTTS(text,rate,resolve); };
        audio.play().catch(function(){ webSpeechTTS(text,rate,resolve); });
        setTimeout(resolve, 8000);
      });
    }
  }catch(e){ console.warn("Gemini TTS 실패:", e.message); }
  return new Promise(function(resolve){ webSpeechTTS(text, rate, resolve); });
}

// ── RECORDER (무음 감지 자동 종료 포함) ──────────────────────────────────────
// AudioContext AnalyserNode로 볼륨을 실시간 측정
// 말소리 감지 후 → 1.8초 무음 지속 시 자동 종료
function createRecorder(onStop, onVolumeChange){
  var stream = null;
  var mr = null;
  var chunks = [];
  var audioCtx = null;
  var analyser = null;
  var silenceTimer = null;
  var speechDetected = false;   // 한 번이라도 말소리가 감지됐는지
  var stopped = false;
  var rafId = null;

  var SILENCE_THRESHOLD = 8;    // 볼륨 기준 (0~255 raw값 기준)
  var SILENCE_DELAY = 2500;     // 무음 지속 ms → 자동 종료 (1.8 → 2.5초)
  var MIN_RECORD_MS = 800;      // 최소 녹음 시간
  var startTime = 0;

  function stopAll(){
    if(stopped) return;
    stopped = true;
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
    if(silenceTimer){ clearTimeout(silenceTimer); silenceTimer=null; }
    if(analyser){ analyser.disconnect(); }
    if(audioCtx && audioCtx.state!=="closed"){ audioCtx.close(); }
    if(mr && mr.state!=="inactive"){ mr.stop(); }
    // stream은 mr.onstop에서 정리
  }

  function monitorVolume(){
    if(stopped || !analyser) return;
    var buf = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(buf);
    // 평균 볼륨 계산
    var sum = 0;
    for(var i=0; i<buf.length; i++) sum+=buf[i];
    var vol = sum/buf.length;  // 0~255 평균
    var pct = Math.min(100, Math.round(vol/255*100*3));
    if(onVolumeChange) onVolumeChange(pct);

    var elapsed = Date.now()-startTime;
    if(vol > SILENCE_THRESHOLD){
      // 말소리 감지 — 타이머 리셋
      speechDetected = true;
      if(silenceTimer){ clearTimeout(silenceTimer); silenceTimer=null; }
    } else if(speechDetected && elapsed > MIN_RECORD_MS){
      // 말소리 이후 무음 → 종료 타이머 시작 (아직 없을 때만)
      if(!silenceTimer){
        silenceTimer = setTimeout(function(){
          if(!stopped) stopAll();
        }, SILENCE_DELAY);
      }
    }
    rafId = requestAnimationFrame(monitorVolume);
  }

  return {
    start: async function(){
      chunks=[]; stopped=false; speechDetected=false; startTime=Date.now();
      try{
        stream = await navigator.mediaDevices.getUserMedia({audio:true});
        // AudioContext로 볼륨 모니터링
        audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        var source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);

        // MediaRecorder
        var mimeType = "audio/webm";
        if(!MediaRecorder.isTypeSupported("audio/webm")){
          mimeType = MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "";
        }
        mr = mimeType ? new MediaRecorder(stream,{mimeType:mimeType}) : new MediaRecorder(stream);
        mr.ondataavailable=function(e){ if(e.data&&e.data.size>0) chunks.push(e.data); };
        mr.onstop=function(){
          stream.getTracks().forEach(function(t){t.stop();});
          var blob=new Blob(chunks,{type:mr.mimeType||"audio/webm"});
          onStop(blob);
        };
        mr.start();
        monitorVolume();
        return true;
      }catch(e){
        console.error("녹음 시작 실패:", e);
        return false;
      }
    },
    stop: function(){ stopAll(); },
    isRecording: function(){ return !stopped && mr && mr.state==="recording"; }
  };
}

// ── GEMINI 오디오 분석 ────────────────────────────────────────────────────────
// 1단계: 오디오 → STT (Gemini가 오디오 직접 청취)
// 2단계: STT 텍스트 + 목표 단어 → 발음 평가 (텍스트 비교이므로 일관성 보장)
async function sttWithGemini(audioBlob){
  var base64 = await new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){ resolve(e.target.result.split(",")[1]); };
    reader.onerror = reject;
    reader.readAsDataURL(audioBlob);
  });
  var mimeType = audioBlob.type || "audio/webm";
  // ★ 프롬프트를 최소화 — Gemini가 프롬프트를 따라 말하지 않도록
  var prompt = '오디오에서 들린 한국어 단어만 출력. 설명 금지. 소리 없으면 (없음) 출력.';
  var body = {
    contents:[{parts:[
      {inline_data:{mime_type:mimeType, data:base64}},
      {text:prompt}
    ]}],
    generationConfig:{temperature:0.1, maxOutputTokens:32}
  };
  var resp = await fetch(getGeminiUrl(),{
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });
  if(!resp.ok) throw new Error("STT HTTP "+resp.status);

async function evaluateWithGemini(sttText, targetWord, fbType){
  var prompt = '당신은 한국어 유아 발음 평가 전문가입니다.\n\n'
    +'목표 단어: "'+targetWord+'"\n'
    +'아이가 발음한 내용 (STT 인식 결과): "'+sttText+'"\n\n'
    +'위 STT 결과를 기준으로 발음을 평가해주세요.\n\n'
    +'채점 기준:\n'
    +'- 5점: STT 결과가 목표 단어와 완전히 일치\n'
    +'- 4점: 목표 단어를 포함하거나 아주 유사 (예: "비행기요" → "비행기")\n'
    +'- 3점: 주요 음절은 맞지만 일부 다름\n'
    +'- 2점: 일부 소리만 유사\n'
    +'- 1점: 많이 다른 발음\n'
    +'- 0점: "(없음)" 이거나 전혀 다른 말\n\n'
    +'중요: STT 결과에 목표 단어가 포함되어 있으면 반드시 4점 이상 주세요.\n\n'
    +'아래 JSON만 응답하세요. 다른 설명 없이:\n'
    +'{"score":5,"missed":"없음","advice":"잘했어요!","phonetics_good":"없음","phonetics_weak":"없음"}\n\n'
    +'- score: 0~5 정수\n'
    +'- missed: 부족한 자음/모음 (없으면 "없음")\n'
    +'- advice: '+(fbType==="detailed"?'발음 개선 조언 1~2문장 (유아에게 친근하게)':'짧은 칭찬 한 문장')+'\n'
    +'- phonetics_good: 잘된 자모음 (없으면 "없음")\n'
    +'- phonetics_weak: 약한 자모음 (없으면 "없음")';
  var body = {
    contents:[{parts:[{text:prompt}]}],
    generationConfig:{temperature:0.3, maxOutputTokens:1024}
  };
  var resp = await fetch(getGeminiUrl(),{
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });
  if(!resp.ok) throw new Error("평가 HTTP "+resp.status);
  var data = await resp.json();
  var raw = data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts[0]
    ? data.candidates[0].content.parts[0].text.trim() : "";
  console.log("[Gemini 평가]", raw);
  return safeParseJSON(raw);
}

async function analyzeAudioWithGemini(audioBlob, targetWord, fbType){
  // 1단계: STT
  var sttText = await sttWithGemini(audioBlob);

  // 2단계: STT 텍스트로 평가 (오디오 재분석 없이 텍스트 비교)
  var parsed = await evaluateWithGemini(sttText, targetWord, fbType);

  return {
    stt: sttText,
    score: Math.min(5, Math.max(0, parseInt(parsed.score)||0)),
    missed: parsed.missed||"",
    advice: parsed.advice||"",
    phonetics_good: parsed.phonetics_good||"",
    phonetics_weak: parsed.phonetics_weak||"",
    _debug: {targetWord:targetWord, stt:sttText, raw:JSON.stringify(parsed).slice(0,150)}
  };
}

            return React.createElement("div",{key:i,className:"flex items-center gap-3 bg-purple-50 rounded-2xl px-4 py-3 border-2 border-purple-100"},
              React.createElement("span",{className:"text-lg font-black text-purple-400 w-6"},i+1),
              React.createElement("span",{className:"text-xl font-black text-purple-700 w-20"},s.word),
              React.createElement("div",{className:"flex gap-0.5"},
                Array.from({length:5}).map(function(_,j){return React.createElement("span",{key:j,className:"text-xl "+(j<(s.score||0)?"":"opacity-20")},j<(s.score||0)?"❤️":"🤍");})),
              s.comment&&React.createElement("span",{className:"text-xs text-gray-500 flex-1"},s.comment)
            );
          })
        )
      ),
      report.recordings&&report.recordings.length>0&&React.createElement("div",{className:"bg-white rounded-3xl p-5 shadow-xl border-4 border-pink-200 no-print"},
        React.createElement("p",{className:"text-xl font-black text-gray-700 mb-3"},"🎵 내 녹음 다시 듣기"),
        React.createElement("div",{className:"space-y-3"},
          report.recordings.map(function(r,i){
            return React.createElement("div",{key:i,className:"bg-pink-50 rounded-2xl p-3 border-2 border-pink-200"},
              React.createElement("div",{className:"flex items-center gap-2 mb-2"},
                React.createElement("span",{className:"text-sm font-black text-pink-500"},i+1+"."),
                React.createElement("span",{className:"text-xl font-black text-pink-700"},r.word),
                React.createElement("button",{onClick:function(){speakKorean(r.word);},className:"text-lg w-8 h-8 rounded-full bg-yellow-200 border-2 border-yellow-300 flex items-center justify-center"},"🔊"),
                r.stt&&React.createElement("span",{className:"text-xs text-gray-400"},'→ "'+r.stt+'"')
              ),
              r.audioUrl?React.createElement("audio",{controls:true,src:r.audioUrl,className:"w-full rounded-xl"}):React.createElement("p",{className:"text-sm text-gray-400"},"녹음 없음")
            );
          })
        )
      ),
      React.createElement("div",{className:"flex gap-3 no-print"},
        React.createElement("button",{onClick:onRestart,className:"flex-1 h-16 rounded-3xl bg-gradient-to-r from-yellow-400 to-orange-400 text-white text-xl font-black shadow-lg border-4 border-orange-400 hover:scale-105 active:scale-95 transition-all"},"🔄 다시 평가"),
        React.createElement("button",{onClick:onExit,className:"flex-1 h-16 rounded-3xl bg-gradient-to-r from-purple-400 to-pink-400 text-white text-xl font-black shadow-lg border-4 border-pink-400 hover:scale-105 active:scale-95 transition-all"},"🏠 처음으로")
      )
    )
  );
}

function PronunciationApp(){
  var _sc=useState("menu"); var screen=_sc[0]; var setScreen=_sc[1];
  var _sa=useState(null); var selectedAge=_sa[0]; var setSelectedAge=_sa[1];
  var _ar=useState(false); var apiReady=_ar[0]; var setApiReady=_ar[1];
  var _tm=useState("unknown"); var ttsMode=_tm[0]; var setTTSMode=_tm[1];

  useEffect(function(){
    _setTTSMode = setTTSMode; // 전역 setter 연결
    loadApiKey().then(function(){ setApiReady(!!GEMINI_API_KEY); });
    function onFirstInteraction(){
      document.removeEventListener("touchstart", onFirstInteraction);
      document.removeEventListener("click", onFirstInteraction);
      initTTSMode();
    }
    document.addEventListener("touchstart", onFirstInteraction);
    document.addEventListener("click", onFirstInteraction);
    return function(){ _setTTSMode = null; };
  },[]);

  if(screen==="practice") return React.createElement(PracticeMode,{age:selectedAge,apiReady:apiReady,ttsMode:ttsMode,onExit:function(){setScreen("menu");}});
  if(screen==="eval") return React.createElement(EvalMode,{age:selectedAge,apiReady:apiReady,ttsMode:ttsMode,onExit:function(){setScreen("menu");}});
  return React.createElement(MainMenu,{apiReady:apiReady,ttsMode:ttsMode,onStart:function(age,mode){setSelectedAge(age);setScreen(mode==="practice"?"practice":"eval");}});
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(PronunciationApp));
</script>
