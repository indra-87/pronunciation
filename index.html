  return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim()||"";

function safeParseJSON(raw){
  const clean=raw.replace(/```json|```/g,"").trim();
  const m=clean.match(/\{[\s\S]*\}/);
  const str=m?m[0]:clean;
  const san=str.replace(/[\x00-\x1F\x7F]/g," ").replace(/,\s*([}\]])/g,"$1");
  try{return JSON.parse(san);}catch(e){
    const strict=san.replace(/'/g,'"').replace(/([{,]\s*)(\w+):/g,'$1"$2":');
    return JSON.parse(strict);
  }
}

// ── SPEECH ───────────────────────────────────────────────────────────────────
function speakKorean(text, rate){
  rate = rate || 0.85;
  return new Promise(function(resolve){
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang="ko-KR"; u.rate=rate; u.pitch=1.1; u.volume=1;
    var voices=window.speechSynthesis.getVoices();
    var kr=voices.find(function(v){return v.lang==="ko-KR"||v.lang==="ko";});
    if(kr) u.voice=kr;
    u.onend=function(){resolve();};
    u.onerror=function(){resolve();};
    window.speechSynthesis.speak(u);
  });
}
async function speakSequence(texts, rate){
  rate = rate || 0.85;
  for(var i=0;i<texts.length;i++){
    var t=texts[i];
    if(!t||t==="없음") continue;
    await speakKorean(t, rate);
    await new Promise(function(r){setTimeout(r,300);});
  }
}
function useAutoSpeak(texts, deps){
  useEffect(function(){
    if(!texts||texts.length===0) return;
    var valid=texts.filter(function(t){return t&&t!=="없음";});
    if(valid.length===0) return;
    var timer=setTimeout(function(){speakSequence(valid,0.85);},600);
    return function(){clearTimeout(timer);window.speechSynthesis.cancel();};
  }, deps);
}

// ── STT HELPER ── onresult에서 즉시 완료, TTS 간섭 방지
function createSTTManager(onResult, onDone, onError, silenceMs){
  silenceMs = silenceMs || 3000; // 기본 3초 무음 자동종료
  var gotResult=false;
  var retryCount=0;
  var recognitionRef={current:null};
  var aborted=false;
  var doneCalledRef={v:false};
  var silenceTimer=null;

  function clearSilenceTimer(){
    if(silenceTimer){clearTimeout(silenceTimer); silenceTimer=null;}
  }

  function callDoneOnce(){
    clearSilenceTimer();
    if(doneCalledRef.v||aborted) return;
    doneCalledRef.v=true;
    onDone();
  }

  function start(){
    if(aborted) return;
    window.speechSynthesis.cancel();

    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){onError("이 브라우저는 음성 인식을 지원하지 않아요");return;}
    var rec=new SR();
    recognitionRef.current=rec;
    rec.lang="ko-KR";
    rec.continuous=false;
    rec.interimResults=false;
    rec.maxAlternatives=3;

    // ★ 무음 자동종료 타이머 — STT 시작 후 silenceMs 안에 결과 없으면 강제 종료
    silenceTimer = setTimeout(function(){
      if(!gotResult && !aborted){
        console.log("무음 타임아웃 ("+silenceMs+"ms) → 강제 종료");
        abort();
      }
    }, silenceMs);

    rec.onresult=function(e){
      if(aborted) return;
      clearSilenceTimer();
      gotResult=true;
      var best=Array.from(e.results[0]).sort(function(a,b){return b.confidence-a.confidence;})[0];
      onResult(best.transcript);
      callDoneOnce();
    };

    rec.onerror=function(e){
      if(aborted) return;
      console.log("STT error:", e.error, "retry:", retryCount);
      if(e.error==="no-speech"&&retryCount<3){
        retryCount++;
        // 재시도 시 타이머 리셋
        clearSilenceTimer();
        silenceTimer = setTimeout(function(){
          if(!gotResult && !aborted){ abort(); }
        }, silenceMs);
        setTimeout(start, 300);
      } else {
        if(e.error!=="aborted") onError(e.error);
        callDoneOnce();
      }
    };

    rec.onend=function(){
      if(aborted) return;
      if(gotResult){
        callDoneOnce();
      } else if(retryCount<3){
        console.log("STT ended without result, retry", retryCount+1);
        retryCount++;
        clearSilenceTimer();
        silenceTimer = setTimeout(function(){
          if(!gotResult && !aborted){ abort(); }
        }, silenceMs);
        setTimeout(start, 300);
      } else {
        callDoneOnce();
      }
    };

    try{ rec.start(); }catch(e){ console.warn("STT start 실패",e); callDoneOnce(); }
  }

  function abort(){
    clearSilenceTimer();
    aborted=true;
    if(recognitionRef.current){
      recognitionRef.current.onend=null;
      recognitionRef.current.onerror=null;
      recognitionRef.current.onresult=null;
      try{recognitionRef.current.stop();}catch(e){}
    }
    callDoneOnce();
  }

  return {start:start, abort:abort};
}

// ── AI ANALYZE ───────────────────────────────────────────────────────────────
async function analyzeWithAI(recText, targetWord, fbType){
  if(!GEMINI_API_KEY){
    var match=recText.trim()===targetWord.trim();
    var partial=targetWord.split("").some(function(ch){return recText.includes(ch);});
    return {
      score:match?5:(partial?3:1),
      missed:recText?("인식된 발음: \""+recText+"\""):"소리가 잘 들리지 않았어요",
      advice:match?"정말 잘했어요! 🎉":("\""+targetWord+"\"를 다시 한 번 따라해 봐요!"),
      phonetics_good:"",phonetics_weak:"",offline:true,
      _debug:{recText:recText,targetWord:targetWord}
    };
  }
  var prompt = '당신은 한국어 유아 발음 평가 전문가입니다.\n\n목표 단어: "'+targetWord+'"\n음성 인식(STT) 결과: "'+(recText||"(인식 실패)")+'"\n\n평가 지침:\n1. STT는 완벽하지 않습니다. "사과"를 말해도 "사과요", "사 과" 등으로 인식될 수 있습니다.\n2. STT 결과에 목표 단어가 포함되어 있거나 매우 유사하면 높은 점수(4~5)를 주세요.\n3. STT 결과가 "(인식 실패)"이거나 목표 단어와 전혀 다르면 낮은 점수(0~2)를 주세요.\n4. 유아/어린이 발음은 성인보다 관대하게 평가하세요.\n\n채점 기준:\n- 5점: STT 결과가 목표 단어와 동일하거나 목표 단어를 포함\n- 4점: 한두 글자 차이 또는 STT 오인식으로 보이는 경우\n- 3점: 첫 음절이나 주요 자음/모음이 맞는 경우\n- 2점: 일부 소리만 비슷한 경우\n- 1점: 거의 다른 소리\n- 0점: 인식 실패 또는 전혀 다른 말\n\n아래 JSON만 응답하세요. 다른 설명 없이:\n{"score":5,"missed":"없음","advice":"잘했어요!","phonetics_good":"없음","phonetics_weak":"없음"}\n\n위 형식의 키를 그대로 사용하고, 실제 평가값을 채워서 응답하세요:\n- score: 위 기준에 따른 0~5 정수\n- missed: 부족한 발음 (없으면 "없음")\n- advice: '+(fbType==="detailed"?'"어떻게 발음을 개선할 수 있는지 유아에게 친근한 말투로 1~2문장"':'"짧은 칭찬이나 격려 한 문장"')+'\n- phonetics_good: 잘된 자모음 (없으면 "없음")\n- phonetics_weak: 약한 자모음 (없으면 "없음")';
  var raw=await callGemini(prompt);
  console.log("[AI응답]",raw);
  var parsed=safeParseJSON(raw);
  return {
    score:Math.min(5,Math.max(0,parseInt(parsed.score)||0)),
    missed:parsed.missed||"",
    advice:parsed.advice||"",
    phonetics_good:parsed.phonetics_good||"",
    phonetics_weak:parsed.phonetics_weak||"",
    offline:false,
    _debug:{recText:recText,targetWord:targetWord,raw:raw.slice(0,120)}
  };
}

          React.createElement(FeedbackCard,{emoji:"✅",label:"잘하는 발음",text:report.good_phonemes,bgClass:"bg-green-50",borderClass:"border-green-200",textClass:"text-green-700 text-lg font-black",labelClass:"text-green-500"}),
          React.createElement(FeedbackCard,{emoji:"⚠️",label:"연습이 필요해요",text:report.weak_phonemes,bgClass:"bg-red-50",borderClass:"border-red-200",textClass:"text-red-700 text-lg font-black",labelClass:"text-red-500"})

function PronunciationApp(){
  var _sc=useState("menu"); var screen=_sc[0]; var setScreen=_sc[1];
  var _sa=useState(null); var selectedAge=_sa[0]; var setSelectedAge=_sa[1];
  var _ar=useState(false); var apiReady=_ar[0]; var setApiReady=_ar[1];
  useEffect(function(){
    loadApiKey().then(function(){setApiReady(!!GEMINI_API_KEY);});
    window.speechSynthesis.getVoices();
  },[]);
  if(screen==="practice") return React.createElement(PracticeMode,{age:selectedAge,onExit:function(){setScreen("menu");}});
  if(screen==="eval") return React.createElement(EvalMode,{age:selectedAge,onExit:function(){setScreen("menu");}});
  return React.createElement(MainMenu,{apiReady:apiReady,onStart:function(age,mode){setSelectedAge(age);setScreen(mode==="practice"?"practice":"eval");}});
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(PronunciationApp));
</script>
