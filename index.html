function getGeminiUrl() {
  return "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=" + GEMINI_API_KEY;
}
async function loadApiKey() {
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/settings?key=eq.gemini_api_key", { headers: SB_HEADS });
    if (!r.ok) return;

  } catch(e) { console.warn("API 키 로드 실패"); }
}
async function callGemini(prompt) {
  const resp = await fetch(getGeminiUrl(), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
    })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(()=>({}));
    throw new Error(err.error?.message || `HTTP ${resp.status}`);
  }
  const data = await resp.json();
  return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
}
function safeParseJSON(raw) {
  const clean = raw.replace(/```json|```/g, "").trim();
  const m = clean.match(/\{[\s\S]*\}/);
  const str = m ? m[0] : clean;
  const san = str.replace(/[\x00-\x1F\x7F]/g, " ").replace(/,\s*([}\]])/g, "$1");
  try { return JSON.parse(san); } catch(e) {
    const strict = san.replace(/'/g, '"').replace(/([{,]\s*)(\w+):/g, '$1"$2":');
    return JSON.parse(strict);
  }
}

// ─── SPEAK HELPER ────────────────────────────────────────────────────────────
function speakKorean(text, rate=0.85) {
  return new Promise(resolve => {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR"; u.rate = rate; u.pitch = 1.1; u.volume = 1;
    const voices = window.speechSynthesis.getVoices();
    const kr = voices.find(v => v.lang === "ko-KR" || v.lang === "ko");
    if (kr) u.voice = kr;
    u.onend = () => resolve();
    u.onerror = () => resolve();
    window.speechSynthesis.speak(u);
  });
}

// 여러 문장을 순서대로 읽어주는 함수 (딜레이 포함)
async function speakSequence(texts, rate=0.85) {
  for (const t of texts) {
    if (!t || t === "없음") continue;
    await speakKorean(t, rate);
    await new Promise(r => setTimeout(r, 300));
  }
}

// useAutoSpeak: result가 바뀔 때 자동으로 텍스트 배열을 읽어줌
function useAutoSpeak(texts, deps) {
  useEffect(() => {
    if (!texts || texts.length === 0) return;
    const validTexts = texts.filter(t => t && t !== "없음");
    if (validTexts.length === 0) return;
    const timer = setTimeout(() => speakSequence(validTexts, 0.85), 600);
    return () => { clearTimeout(timer); window.speechSynthesis.cancel(); };
  }, deps);
}

// ─── UI HELPERS ──────────────────────────────────────────────────────────────
function HeartScore({ score, max=5 }) {
  return (
    <div className="flex gap-1 justify-center">
      {Array.from({length: max}).map((_,i) => (
        <span key={i} className={`text-3xl transition-all duration-300 ${i < score ? 'animate-heartbeat' : 'opacity-20'}`}>
          {i < score ? "❤️" : "🤍"}
        </span>
      ))}
    </div>
  );
}

function SpeakBtn({ text, size="lg", label="" }) {

  const sizeClass = size === "lg" ? "text-4xl w-16 h-16" : "text-2xl w-10 h-10";
  return (
    <button
      onClick={() => { setPlaying(true); speakKorean(text).then(()=>setPlaying(false)); }}
      className={`${sizeClass} rounded-full bg-yellow-300 hover:bg-yellow-400 active:scale-95 transition-all flex items-center justify-center shadow-lg border-4 border-yellow-400 ${playing ? 'animate-bounce' : ''}`}
      title={label || `"${text}" 듣기`}
    >

  );
}

  const [playing, setPlaying] = useState(false);
  useEffect(() => {
    if (autoPlay && text && text !== "없음") {
      const t = setTimeout(() => { setPlaying(true); speakKorean(text, 0.82).then(()=>setPlaying(false)); }, 400);
      return () => clearTimeout(t);
    }
  }, [autoPlay, text]);
  if (!text || text === "없음") return null;
  return (
    <div className={`rounded-2xl p-4 border-2 ${bgClass} ${borderClass}`}>
      <div className="flex items-start gap-3">
        <button

          <p className={`text-base font-bold leading-relaxed ${textClass}`}>{text}</p>

      </div>

  );
}

// ─── PRACTICE FEEDBACK CARD (자동 음성 읽기 포함) ──────────────────────────
function PracticeFeedbackCard({ result, feedbackType, audioUrl, word, onNext }) {
  const scoreLabel = result.score >= 4 ? "정말 잘했어요!" : result.score >= 3 ? "좋아요!" : "조금 더 연습해요!";

  const autoTexts = [scoreLabel];
  if (feedbackType === "detailed") {
    if (result.missed && result.missed !== "없음") autoTexts.push(result.missed);
    if (result.advice) autoTexts.push(result.advice);
  }
  useAutoSpeak(autoTexts, [result]);

  const allTexts = [
    scoreLabel,
    ...(feedbackType === "detailed" ? [result.missed, result.advice].filter(Boolean) : [])
  ];

  return (
    <div className="bg-white/95 rounded-3xl p-5 w-full max-w-md border-4 border-yellow-200 shadow-xl animate-pop space-y-3">
      {/* 🔍 디버그 패널 — STT/AI 값 확인용 */}
      {result._debug && (
        <details className="bg-gray-100 rounded-2xl border-2 border-gray-300 text-xs">
          <summary className="px-3 py-2 font-black text-gray-500 cursor-pointer">🔍 개발자 확인용 (탭하여 열기)</summary>
          <div className="px-3 pb-3 space-y-1 text-gray-600 break-all">
            <p><span className="font-black">목표 단어:</span> {result._debug.targetWord}</p>
            <p><span className="font-black">STT 인식값:</span> "{result._debug.recText || '(없음)'}"</p>
            {result._debug.raw && <p><span className="font-black">AI 원본:</span> {result._debug.raw}</p>}
          </div>
        </details>
      )}

      {/* 점수 헤더 */}
      <div className="text-center">
        <p className="text-3xl font-black text-yellow-700">{scoreEmoji} {scoreLabel}</p>
        <div className="mt-2"><HeartScore score={result.score} /></div>
      </div>

      {/* 전체 읽기 버튼 */}
      <ReadAllBtn texts={allTexts} label="피드백 전체 읽기 🔊" />

      {/* 내 목소리 듣기 */}

          </div>
        </div>

      {feedbackType === "detailed" && (
        <div className="space-y-2">
          <FeedbackCard
            emoji="⚠️" label="부족한 발음"
            text={result.missed}
            bgClass="bg-red-50" borderClass="border-red-200"
            textClass="text-red-700" labelClass="text-red-500"

          <FeedbackCard
            emoji="💡" label="이렇게 해봐요!"
            text={result.advice}

            textClass="text-blue-700" labelClass="text-blue-500"
          />

          className="flex-1 h-16 rounded-2xl bg-gradient-to-r from-green-400 to-teal-400 text-white text-xl font-black shadow-lg hover:scale-105 active:scale-95 transition-all border-4 border-green-500">
          다음 단어 ▶
        </button>
        <button onClick={() => speakKorean(word)}
          className="w-16 h-16 rounded-2xl bg-yellow-300 border-4 border-yellow-400 text-3xl shadow-lg hover:scale-105 active:scale-95 transition-all">

        </button>

}

// ─── SCREEN: PRACTICE MODE ───────────────────────────────────────────────────
function PracticeMode({ age, onExit }) {
  const [feedbackType, setFeedbackType] = useState(null); // "simple" | "detailed"
  const [phase, setPhase] = useState("setup"); // setup | practice | result
  const [word, setWord] = useState("");
  const [recording, setRecording] = useState(false);
  const [audioUrl, setAudioUrl] = useState(null);
  const [recognized, setRecognized] = useState("");
  const [analyzing, setAnalyzing] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState("");
  const mediaRecorderRef = useRef(null);
  const chunksRef = useRef([]);
  const recognitionRef = useRef(null);
  // ★ ref로도 동기 추적 — React 클로저 문제 해결
  const recognizedRef = useRef("");
  const wordRef = useRef("");
  const feedbackTypeRef = useRef("");

  function pickWord() {
    const list = WORDS[age];
    return list[Math.floor(Math.random() * list.length)];
  }

  function startPractice(type) {
    setFeedbackType(type);
    feedbackTypeRef.current = type;
    const w = pickWord();
    setWord(w);
    wordRef.current = w;
    setPhase("practice");
    setResult(null);
    setAudioUrl(null);
    setRecognized("");
    recognizedRef.current = "";
    setError("");
  }

  function nextWord() {
    const w = pickWord();
    setWord(w);
    wordRef.current = w;
    setResult(null);
    setAudioUrl(null);
    setRecognized("");
    recognizedRef.current = "";
    setError("");
  }

  async function startRecording() {
    setError("");
    setRecognized("");
    recognizedRef.current = "";
    setAudioUrl(null);
    setResult(null);
    chunksRef.current = [];

    // Start audio recording
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mr = new MediaRecorder(stream);
      mediaRecorderRef.current = mr;
      mr.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };
      mr.onstop = () => {
        const blob = new Blob(chunksRef.current, { type: "audio/webm" });
        const url = URL.createObjectURL(blob);
        setAudioUrl(url);
        stream.getTracks().forEach(t => t.stop());
      };
      mr.start();
    } catch(e) { console.warn("오디오 녹음 실패:", e.message); }

    // Start STT
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const rec = new SpeechRecognition();
      recognitionRef.current = rec;
      rec.lang = "ko-KR"; rec.continuous = false; rec.interimResults = false;

      rec.onresult = e => {
        const text = e.results[0][0].transcript;
        recognizedRef.current = text;   // ★ ref에도 즉시 저장
        setRecognized(text);
      };
      rec.onerror = e => {
        setError("음성 인식 오류: " + e.error);
        finishRecording();              // 오류 시에도 자동 종료
      };
      // ★ 말이 끝나면 자동으로 STT가 onend를 발생시킴 → 자동 종료
      rec.onend = () => {
        finishRecording();
      };
      rec.start();
    } else {
      setError("이 브라우저는 음성 인식을 지원하지 않아요 😢");
    }
    setRecording(true);
  }

  // 수동 중지 버튼에서도 같은 함수 호출
  function stopRecording() {
    if (recognitionRef.current) {
      recognitionRef.current.onend = null; // 중복 호출 방지
      recognitionRef.current.stop();
    }
    finishRecording();
  }

  // ★ 공통 종료 처리 — ref 값으로 분석하므로 클로저 문제 없음
  function finishRecording() {
    setRecording(false);
    if (mediaRecorderRef.current && mediaRecorderRef.current.state !== "inactive") {
      mediaRecorderRef.current.stop();
    }
    // 약간의 딜레이 후 분석 (MediaRecorder.onstop 완료 대기)
    setTimeout(() => analyzeResult(recognizedRef.current, wordRef.current, feedbackTypeRef.current), 600);
  }

  async function analyzeResult(recText, targetWord, fbType) {
    setAnalyzing(true);
    setError("");
    try {
      if (!GEMINI_API_KEY) {
        // 오프라인 모드: 단순 텍스트 비교
        const match = recText.trim() === targetWord.trim();
        const partial = targetWord.split("").some(ch => recText.includes(ch));
        setResult({
          score: match ? 5 : (partial ? 3 : 1),
          missed: recText ? `인식된 발음: "${recText}"` : "소리가 잘 들리지 않았어요",
          advice: match ? "정말 잘했어요! 🎉" : `"${targetWord}"를 다시 한 번 따라해 봐요!`,
          phonetics_good: "", phonetics_weak: "",
          offline: true,
          _debug: { recText, targetWord }
        });
      } else {
        const prompt = `당신은 한국어 유아 발음 평가 전문가입니다.

목표 단어: "${targetWord}"
음성 인식(STT) 결과: "${recText || '(인식 실패)'}"

평가 지침:
1. STT는 완벽하지 않습니다. "사과"를 말해도 "사 과", "사과요", "사과야" 등으로 인식될 수 있습니다.
2. STT 결과에 목표 단어가 포함되어 있거나 매우 유사하면 높은 점수(4~5)를 주세요.
3. STT 결과가 "(인식 실패)"이거나 목표 단어와 전혀 다르면 낮은 점수(0~2)를 주세요.
4. 유아/어린이 발음은 성인보다 관대하게 평가하세요.

채점 기준:
- 5점: STT 결과가 목표 단어와 동일하거나 목표 단어를 포함
- 4점: 한두 글자 차이 또는 STT 오인식으로 보이는 경우
- 3점: 첫 음절이나 주요 자음/모음이 맞는 경우
- 2점: 일부 소리만 비슷한 경우
- 1점: 거의 다른 소리
- 0점: 인식 실패 또는 전혀 다른 말

아래 JSON만 응답하세요. 다른 설명 없이:
{"score":5,"missed":"없음","advice":"잘했어요!","phonetics_good":"없음","phonetics_weak":"없음"}

위 형식의 키를 그대로 사용하고, 실제 평가값을 채워서 응답하세요:
- score: 위 기준에 따른 0~5 정수
- missed: 부족한 발음 (없으면 "없음")
- advice: ${fbType === "detailed" ? "어떻게 발음을 개선할 수 있는지 유아에게 친근한 말투로 1~2문장" : "짧은 칭찬이나 격려 한 문장"}
- phonetics_good: 잘된 자모음 (없으면 "없음")
- phonetics_weak: 약한 자모음 (없으면 "없음")`;

        const raw = await callGemini(prompt);
        console.log("[AI 원본 응답]", raw);   // 디버그용
        let parsed;
        try {
          parsed = safeParseJSON(raw);
        } catch(parseErr) {
          console.error("[JSON 파싱 실패]", parseErr, raw);
          throw new Error("AI 응답 파싱 실패: " + raw.slice(0, 80));
        }
        console.log("[파싱 결과]", parsed);   // 디버그용
        setResult({
          score: Math.min(5, Math.max(0, parseInt(parsed.score) ?? 0)),
          missed: parsed.missed || "",
          advice: parsed.advice || "",
          phonetics_good: parsed.phonetics_good || "",
          phonetics_weak: parsed.phonetics_weak || "",
          offline: false,
          _debug: { recText, targetWord, raw: raw.slice(0, 120) }
        });
      }
    } catch(e) {
      console.error("[analyzeResult 오류]", e);
      setError("AI 분석 오류: " + e.message);
      setResult({ score: 0, missed: "분석 실패", advice: "다시 시도해보세요!", offline: true, _debug: { recText, targetWord } });
    }
    setAnalyzing(false);
  }

  if (phase === "setup") {
    return (
      <div className="min-h-screen bg-gradient-to-b from-green-100 to-blue-100 flex flex-col items-center justify-center p-6 gap-6">
        <button onClick={onExit} className="self-start text-2xl bg-white/70 rounded-full px-4 py-2 font-bold text-gray-500 hover:bg-white">← 뒤로</button>
        <div className="text-center">
          <div className="text-7xl animate-float">🎮</div>
          <h2 className="text-4xl font-black text-green-700 mt-2">연습 모드</h2>
        </div>
        <div className="bg-white/80 rounded-3xl p-6 w-full max-w-md border-4 border-green-200 shadow-xl">
          <div className="flex items-center gap-3 mb-5">
            <SpeakBtn text="어떤 피드백을 받을까요?" size="md" />
            <p className="text-xl font-black text-gray-700">피드백 종류를 골라요!</p>
          </div>
          <div className="flex flex-col gap-4">
            <button onClick={() => startPractice("simple")}
              className="w-full h-28 rounded-2xl bg-pastel-pink border-4 border-pink-300 flex flex-col items-center justify-center gap-1 hover:scale-105 transition-all shadow-lg">
              <span className="text-3xl">❤️❤️❤️</span>
              <span className="text-xl font-black text-pink-700">간단 피드백</span>
              <span className="text-sm text-pink-500">하트로만 점수를 알려줘요</span>
            </button>
            <button onClick={() => startPractice("detailed")}
              className="w-full h-28 rounded-2xl bg-pastel-purple border-4 border-purple-300 flex flex-col items-center justify-center gap-1 hover:scale-105 transition-all shadow-lg">
              <span className="text-3xl">❤️💬✨</span>
              <span className="text-xl font-black text-purple-700">상세 피드백</span>
              <span className="text-sm text-purple-500">하트 + 자세한 조언도 알려줘요</span>
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-gradient-to-b from-green-100 to-purple-100 flex flex-col items-center p-4 gap-4">
      <div className="w-full max-w-md flex items-center justify-between">
        <button onClick={onExit} className="text-xl bg-white/70 rounded-full px-4 py-2 font-bold text-gray-500 hover:bg-white">← 나가기</button>
        <span className="bg-white/80 rounded-full px-4 py-2 font-bold text-green-600 border-2 border-green-200">🎮 연습 모드 ({age}세)</span>
      </div>

      <div className="bg-white/90 rounded-3xl p-6 w-full max-w-md border-4 border-purple-200 shadow-xl text-center">
        <div className="flex items-center justify-center gap-4 mb-2">
          <SpeakBtn text={word} size="lg" label="단어 듣기" />
          <WordCard word={word} />
          <SpeakBtn text={word} size="lg" label="단어 듣기" />
        </div>
        <p className="text-base text-gray-400 mt-2 font-bold">🔊 버튼을 눌러서 먼저 들어보세요!</p>
      </div>

      <div className="bg-white/90 rounded-3xl p-4 w-full max-w-md border-4 border-pink-200 shadow-xl text-center">
        <div className="flex items-center justify-center gap-3 mb-2">
          <SpeakBtn text="마이크 버튼을 누르고 따라 읽어보세요" size="md" />
          <p className="text-lg font-black text-pink-700">{recording ? "지금 말해요! 🎤" : "따라 읽어봐요!"}</p>
        </div>
        <BigMicBtn recording={recording} onClick={recording ? stopRecording : startRecording} disabled={analyzing} />
        {recognized && !result && (
          <div className="mt-2 bg-purple-50 rounded-2xl px-4 py-2 border-2 border-purple-200">
            <p className="text-sm text-purple-400 font-bold">들린 내용:</p>

        {error && <p className="text-sm text-red-500 mt-2 font-bold">{error}</p>}

// ─── SCREEN: EVAL MODE ───────────────────────────────────────────────────────
function EvalMode({ age, onExit }) {
  const TOTAL = 7;
  const [phase, setPhase] = useState("intro"); // intro | question | report
  const [qIndex, setQIndex] = useState(0);
  const [words, setWords] = useState([]);
  const [recordings, setRecordings] = useState([]); // [{word, audioUrl, recognized}]
  const [recording, setRecording] = useState(false);
  const [recognized, setRecognized] = useState("");
  const [audioUrl, setAudioUrl] = useState(null);
  const [analyzing, setAnalyzing] = useState(false);
  const [report, setReport] = useState(null);
  const [error, setError] = useState("");
  const mediaRecorderRef = useRef(null);
  const chunksRef = useRef([]);
  const recognitionRef = useRef(null);
  // ★ ref로 동기 추적
  const recognizedRef = useRef("");
  const audioUrlRef = useRef(null);
  const recordingsRef = useRef([]);
  const qIndexRef = useRef(0);
  const wordsRef = useRef([]);

  function initWords() {
    const pool = [...EVAL_WORDS[age]];
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, TOTAL);
  }

  function startEval() {
    const w = initWords();
    setWords(w);
    wordsRef.current = w;
    setQIndex(0);
    qIndexRef.current = 0;
    setRecordings([]);
    recordingsRef.current = [];
    setPhase("question");
    setRecognized("");
    recognizedRef.current = "";
    setAudioUrl(null);
    audioUrlRef.current = null;
    setError("");
  }

  async function startRecording() {
    setError("");
    setRecognized("");
    recognizedRef.current = "";
    setAudioUrl(null);
    audioUrlRef.current = null;
    chunksRef.current = [];
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mr = new MediaRecorder(stream);
      mediaRecorderRef.current = mr;
      mr.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };
      mr.onstop = () => {
        const blob = new Blob(chunksRef.current, { type: "audio/webm" });
        const url = URL.createObjectURL(blob);
        audioUrlRef.current = url;      // ★ ref에도 저장
        setAudioUrl(url);
        stream.getTracks().forEach(t => t.stop());
      };
      mr.start();
    } catch(e) { console.warn("녹음 실패:", e.message); }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const rec = new SpeechRecognition();
      recognitionRef.current = rec;
      rec.lang = "ko-KR"; rec.continuous = false; rec.interimResults = false;
      rec.onresult = e => {
        const text = e.results[0][0].transcript;
        recognizedRef.current = text;   // ★ ref에도 즉시 저장
        setRecognized(text);
      };
      rec.onerror = e => {
        setError("인식 오류: " + e.error);
        finishEvalRecording();
      };
      // ★ 말이 끝나면 자동 종료
      rec.onend = () => { finishEvalRecording(); };
      rec.start();
    }
    setRecording(true);
  }

  function stopRecording() {
    if (recognitionRef.current) {
      recognitionRef.current.onend = null;
      recognitionRef.current.stop();
    }
    finishEvalRecording();
  }

  function finishEvalRecording() {
    setRecording(false);
    if (mediaRecorderRef.current && mediaRecorderRef.current.state !== "inactive") {
      mediaRecorderRef.current.stop();
    }
    // MediaRecorder.onstop 완료 대기 후 다음 버튼 활성화
    setTimeout(() => {
      setAudioUrl(audioUrlRef.current); // 최신값 동기화
      setRecognized(recognizedRef.current);
    }, 500);
  }

  function saveAndNext() {
    // ★ ref 값 사용 — 클로저 문제 없음
    const entry = {
      word: wordsRef.current[qIndexRef.current],
      audioUrl: audioUrlRef.current,
      recognized: recognizedRef.current || "(인식 실패)"
    };
    const newRecs = [...recordingsRef.current, entry];
    recordingsRef.current = newRecs;
    setRecordings(newRecs);

    const nextIdx = qIndexRef.current + 1;
    if (nextIdx < TOTAL) {
      qIndexRef.current = nextIdx;
      setQIndex(nextIdx);
      setRecognized("");
      recognizedRef.current = "";
      setAudioUrl(null);
      audioUrlRef.current = null;
      setError("");
    } else {
      generateReport(newRecs);
    }
  }

  async function generateReport(recs) {
    setPhase("analyzing");
    setAnalyzing(true);
    try {
      if (!GEMINI_API_KEY) {
        // 오프라인 리포트
        const scores = recs.map(r => ({ word: r.word, score: r.word === r.recognized ? 5 : 3 }));
        setReport({
          level: age,
          praise: "열심히 발음 연습을 했어요! 정말 대단해요! 🌟",
          improve: "더 많이 연습하면 더 잘할 수 있어요!",
          good_phonemes: "ㅏ, ㅣ, ㄱ, ㅅ",
          weak_phonemes: "ㄹ, ㅊ, ㅈ",
          scores,
          offline: true
        });
      } else {
        const summary = recs.map((r,i) => `${i+1}. "${r.word}" → 아이가 말한 것: "${r.recognized}"`).join("\n");
        const prompt = `당신은 언어치료 전문가입니다. 아래는 ${age}세 아이의 발음 평가 결과입니다:

${summary}

이 아이의 발음 수준을 종합 평가해주세요. 반드시 아래 JSON만 응답하세요:
{"level":"(5, 6, 7 중 이 아이 발음이 몇 세 수준에 해당하는지 숫자로)","praise":"(잘한 점 칭찬 2~3문장, 구체적으로)","improve":"(보완해야 할 점 2~3문장, 친절하고 구체적으로)","good_phonemes":"(잘한 자모음 예: ㅏ,ㅣ,ㄱ,ㅅ 등)","weak_phonemes":"(약한 자모음 예: ㄹ,ㅊ,ㅈ 등)","scores":[{"word":"단어","score":(0~5 정수),"comment":"짧은 한 줄 평"}]}`;

        const raw = await callGemini(prompt);
        const parsed = safeParseJSON(raw);
        setReport({
          level: parseInt(parsed.level) || age,
          praise: parsed.praise || "잘 했어요!",
          improve: parsed.improve || "더 연습해봐요!",
          good_phonemes: parsed.good_phonemes || "",
          weak_phonemes: parsed.weak_phonemes || "",
          scores: parsed.scores || [],
          offline: false
        });
      }
    } catch(e) {
      setReport({
        level: age,
        praise: "평가를 완료했어요! 잘 했어요! 🎉",
        improve: "계속 연습해봐요!",
        good_phonemes: "", weak_phonemes: "",
        scores: recs.map(r => ({ word: r.word, score: 3, comment: "" })),
        offline: true
      });
    }
    setAnalyzing(false);
    setPhase("report");
  }

  // ── INTRO ──
  if (phase === "intro") {
    return (
      <div className="min-h-screen bg-gradient-to-b from-yellow-100 to-orange-100 flex flex-col items-center justify-center p-6 gap-6">
        <button onClick={onExit} className="self-start text-xl bg-white/70 rounded-full px-4 py-2 font-bold text-gray-500">← 뒤로</button>
        <div className="text-center">
          <div className="text-7xl animate-float">🏆</div>
          <h2 className="text-4xl font-black text-yellow-700 mt-2">평가 모드</h2>
          <p className="text-lg text-yellow-600 mt-1 font-bold">{age}세 수준 · 총 {TOTAL}문제</p>
        </div>
        <div className="bg-white/90 rounded-3xl p-6 w-full max-w-md border-4 border-yellow-200 shadow-xl space-y-3">
          <div className="flex items-center gap-3">
            <SpeakBtn text="발음 평가를 시작해요" size="md" />
            <p className="text-lg font-black text-gray-700">이렇게 해요!</p>
          </div>
          {[
            ["1️⃣", "단어를 듣고"],
            ["2️⃣", "마이크 버튼을 눌러요"],
            ["3️⃣", "따라 읽어요"],
            ["4️⃣", "총 7문제 다 풀어요"],
            ["5️⃣", "마지막에 종합 리포트가 나와요! 🎉"],
          ].map(([icon, text]) => (
            <div key={text} className="flex items-center gap-3 bg-yellow-50 rounded-2xl px-4 py-3 border-2 border-yellow-100">
              <span className="text-2xl">{icon}</span>
              <span className="text-lg font-bold text-gray-700">{text}</span>
            </div>
          ))}
        </div>
        <button onClick={startEval} className="w-full max-w-md h-20 rounded-3xl bg-gradient-to-r from-yellow-400 to-orange-400 text-white text-3xl font-black shadow-xl border-4 border-orange-400 hover:scale-105 active:scale-95 transition-all animate-glow">
          시작! 🚀
        </button>
      </div>
    );
  }

  // ── ANALYZING ──
  if (phase === "analyzing") {
    return (
      <div className="min-h-screen bg-gradient-to-b from-yellow-100 to-purple-100 flex flex-col items-center justify-center gap-6">
        <Spinner text="AI가 종합 평가 중이에요... 🤖" />
        <p className="text-lg text-purple-500 font-bold animate-pulse">잠깐만 기다려요! 🌟</p>
      </div>
    );
  }

  // ── REPORT ──
  if (phase === "report" && report) {
    return <EvalReport report={report} recordings={recordings} age={age} onRestart={startEval} onExit={onExit} />;
  }

  // ── QUESTION ──
  const currentWord = words[qIndex] || "";
  const progress = ((qIndex) / TOTAL) * 100;
  const hasRecorded = (audioUrl !== null) || (recognized !== ""); // 녹음 또는 인식 결과가 있으면 활성화

  return (
    <div className="min-h-screen bg-gradient-to-b from-yellow-100 to-blue-100 flex flex-col items-center p-4 gap-4">
      <div className="w-full max-w-md">
        <div className="flex items-center justify-between mb-2">
          <button onClick={onExit} className="text-xl bg-white/70 rounded-full px-4 py-2 font-bold text-gray-500">← 나가기</button>
          <span className="bg-white/80 rounded-full px-4 py-2 font-bold text-yellow-600 border-2 border-yellow-200">
            {qIndex + 1} / {TOTAL} 🏆
          </span>
        </div>
        <div className="w-full bg-yellow-200 rounded-full h-4 border-2 border-yellow-300 overflow-hidden">
          <div className="h-full bg-gradient-to-r from-yellow-400 to-orange-400 rounded-full transition-all duration-500" style={{ width: `${progress}%` }} />
        </div>
      </div>

      <div className="bg-white/90 rounded-3xl p-6 w-full max-w-md border-4 border-yellow-200 shadow-xl text-center">
        <p className="text-sm font-bold text-gray-400 mb-3">문제 {qIndex+1}</p>
        <div className="flex items-center justify-center gap-4 mb-2">
          <SpeakBtn text={currentWord} size="lg" label="단어 듣기" />
          <WordCard word={currentWord} />
          <SpeakBtn text={currentWord} size="lg" label="단어 듣기" />
        </div>
        <p className="text-sm text-gray-400 mt-2 font-bold">🔊 먼저 듣고 따라 읽어요!</p>
      </div>

      <div className="bg-white/90 rounded-3xl p-5 w-full max-w-md border-4 border-pink-200 shadow-xl text-center">
        <div className="flex items-center justify-center gap-3 mb-1">
          <SpeakBtn text={recording ? "지금 말해요" : "마이크 버튼을 눌러요"} size="md" />
          <p className="text-lg font-black text-pink-700">{recording ? "말하고 있어요! 🎤" : "따라 읽어요 🎙️"}</p>
        </div>
        <BigMicBtn recording={recording} onClick={recording ? stopRecording : startRecording} disabled={false} />
        {recognized && (
          <div className="mt-2 bg-purple-50 rounded-2xl px-4 py-2 border-2 border-purple-200">
            <p className="text-sm text-purple-400 font-bold">들린 내용: "{recognized}"</p>
          </div>
        )}
        {audioUrl && !recording && (
          <div className="mt-3 flex items-center justify-center gap-2">
            <span className="text-xl">✅</span>
            <audio controls src={audioUrl} className="w-full max-w-xs rounded-xl" />
          </div>
        )}
        {error && <p className="text-sm text-red-500 mt-2 font-bold">{error}</p>}
      </div>

      <button
        onClick={saveAndNext}
        disabled={!hasRecorded && !recognized}
        className={`w-full max-w-md h-16 rounded-3xl text-2xl font-black shadow-xl border-4 transition-all
          ${hasRecorded || recognized
            ? 'bg-gradient-to-r from-yellow-400 to-orange-400 text-white border-orange-400 hover:scale-105 active:scale-95'
            : 'bg-gray-200 text-gray-400 border-gray-300 opacity-60 cursor-not-allowed'}`}
      >
        {qIndex + 1 < TOTAL ? "다음 문제 ▶" : "결과 보기 🏆"}
      </button>
    </div>
  );
}

// ─── EVAL REPORT ─────────────────────────────────────────────────────────────
function EvalReport({ report, recordings, age, onRestart, onExit }) {
  const avgScore = report.scores && report.scores.length > 0
    ? (report.scores.reduce((s, r) => s + (r.score || 0), 0) / report.scores.length).toFixed(1)
    : "?";
  const stars = Math.round(parseFloat(avgScore)) || 0;

  // 리포트가 처음 렌더될 때 자동으로 전체 읽어주기
  const introText = `발음 평가가 끝났어요! ${report.level}세 레벨이에요.`;
  useAutoSpeak([introText, report.praise, report.improve], [report]);

  const allReadTexts = [
    introText,
    report.praise,
    report.improve,
    report.good_phonemes && report.good_phonemes !== "없음" ? `잘하는 발음은 ${report.good_phonemes} 이에요.` : null,
    report.weak_phonemes && report.weak_phonemes !== "없음" ? `더 연습할 발음은 ${report.weak_phonemes} 이에요.` : null,
  ].filter(Boolean);

  return (
    <div className="min-h-screen bg-gradient-to-b from-purple-100 via-pink-100 to-yellow-100 p-4 pb-10">
      <div className="max-w-lg mx-auto space-y-5">

        {/* Header */}
        <div className="flex items-center justify-between no-print">
          <button onClick={onExit} className="text-xl bg-white/70 rounded-full px-4 py-2 font-bold text-gray-500">← 나가기</button>
          <div className="flex gap-2">
            <button onClick={() => window.print()} className="bg-blue-400 text-white rounded-full px-4 py-2 font-bold text-sm hover:bg-blue-500">🖨️ 인쇄</button>
            <button onClick={onRestart} className="bg-yellow-400 text-white rounded-full px-4 py-2 font-bold text-sm hover:bg-yellow-500">🔄 다시</button>
          </div>
        </div>

        {/* Title */}
        <div className="bg-white rounded-3xl p-6 shadow-xl border-4 border-yellow-200 text-center print-full">
          <div className="text-5xl mb-2 animate-float">🏆</div>
          <h2 className="text-3xl font-black text-yellow-700">발음 평가 리포트</h2>
          <p className="text-gray-400 font-bold mt-1">{age}세 도전 완료!</p>
          <div className="flex justify-center gap-1 mt-3">
            {Array.from({length:5}).map((_,i) => (
              <span key={i} className={`text-4xl transition-all ${i < stars ? '' : 'opacity-20'}`}>{i < stars ? '⭐' : '☆'}</span>
            ))}
          </div>
          <p className="text-2xl font-black text-purple-600 mt-2">평균 점수: {avgScore}점 / 5점</p>
        </div>

        {/* 전체 읽기 버튼 */}
        <div className="no-print">
          <ReadAllBtn texts={allReadTexts} label="리포트 전체 읽어주기 🔊" />
        </div>

        {/* Level */}
        <div className="bg-gradient-to-r from-purple-200 to-pink-200 rounded-3xl p-5 shadow-lg border-4 border-purple-300 print-full">
          <FeedbackCard
            emoji="🎯" label="발음 수준"
            text={`${report.level}세 레벨이에요! 정말 잘했어요!`}
            bgClass="bg-white/60" borderClass="border-white/40"
            textClass="text-purple-800 text-2xl font-black" labelClass="text-purple-500"
          />
        </div>

        {/* Praise */}
        <FeedbackCard
          emoji="🌟" label="잘한 점!"
          text={report.praise}
          bgClass="bg-green-50" borderClass="border-green-200"
          textClass="text-green-800" labelClass="text-green-600"
        />

        {/* Improve */}
        <FeedbackCard
          emoji="💪" label="더 잘할 수 있어요!"
          text={report.improve}
          bgClass="bg-blue-50" borderClass="border-blue-200"
          textClass="text-blue-800" labelClass="text-blue-600"
        />

        {/* Phoneme Analysis */}
        {(report.good_phonemes || report.weak_phonemes) && (
          <div className="bg-white rounded-3xl p-5 shadow-xl border-4 border-gray-200 print-full space-y-3">
            <p className="text-xl font-black text-gray-700">🔬 발음 분석</p>
            <FeedbackCard
              emoji="✅" label="잘하는 발음"
              text={report.good_phonemes}
              bgClass="bg-green-50" borderClass="border-green-200"
              textClass="text-green-700 text-lg font-black" labelClass="text-green-500"
            />
            <FeedbackCard
              emoji="⚠️" label="연습이 필요해요"
              text={report.weak_phonemes}
              bgClass="bg-red-50" borderClass="border-red-200"
              textClass="text-red-700 text-lg font-black" labelClass="text-red-500"
            />
          </div>
        )}

        {/* Per-question scores */}
        {report.scores && report.scores.length > 0 && (
          <div className="bg-white rounded-3xl p-5 shadow-xl border-4 border-purple-200 print-full">
            <p className="text-xl font-black text-gray-700 mb-3">📋 문제별 결과</p>
            <div className="space-y-3">
              {report.scores.map((s, i) => (
                <div key={i} className="flex items-center gap-3 bg-purple-50 rounded-2xl px-4 py-3 border-2 border-purple-100">
                  <span className="text-lg font-black text-purple-400 w-6">{i+1}</span>
                  <span className="text-xl font-black text-purple-700 w-20">{s.word}</span>
                  <div className="flex gap-0.5">
                    {Array.from({length:5}).map((_,j) => (
                      <span key={j} className={`text-xl ${j < (s.score||0) ? '' : 'opacity-20'}`}>{j < (s.score||0) ? '❤️' : '🤍'}</span>
                    ))}
                  </div>
                  {s.comment && (
                    <button
                      onClick={() => speakKorean(s.comment)}
                      className="ml-auto text-xl w-9 h-9 rounded-full bg-yellow-200 border-2 border-yellow-300 flex items-center justify-center hover:scale-110 active:scale-95 transition-all shrink-0"
                      title="코멘트 듣기"
                    >🔊</button>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Audio playback */}
        <div className="bg-white rounded-3xl p-5 shadow-xl border-4 border-pink-200 no-print">
          <p className="text-xl font-black text-gray-700 mb-3">🎵 내 녹음 다시 듣기</p>
          <div className="space-y-3">
            {recordings.map((r, i) => (
              <div key={i} className="bg-pink-50 rounded-2xl p-3 border-2 border-pink-200">
                <div className="flex items-center gap-2 mb-2">
                  <span className="text-sm font-black text-pink-500">{i+1}.</span>
                  <span className="text-xl font-black text-pink-700">{r.word}</span>
                  <button onClick={() => speakKorean(r.word)} className="text-lg w-8 h-8 rounded-full bg-yellow-200 border-2 border-yellow-300 flex items-center justify-center hover:scale-110 transition-all">🔊</button>
                  <span className="text-xs text-gray-400">→ "{r.recognized}"</span>
                </div>
                {r.audioUrl
                  ? <audio controls src={r.audioUrl} className="w-full rounded-xl" />
                  : <p className="text-sm text-gray-400">녹음 없음</p>
                }
              </div>
            ))}
          </div>
        </div>

        {/* Action buttons */}
        <div className="flex gap-3 no-print">
          <button onClick={onRestart} className="flex-1 h-16 rounded-3xl bg-gradient-to-r from-yellow-400 to-orange-400 text-white text-xl font-black shadow-lg border-4 border-orange-400 hover:scale-105 active:scale-95 transition-all">
            🔄 다시 평가
          </button>
          <button onClick={onExit} className="flex-1 h-16 rounded-3xl bg-gradient-to-r from-purple-400 to-pink-400 text-white text-xl font-black shadow-lg border-4 border-pink-400 hover:scale-105 active:scale-95 transition-all">
            🏠 처음으로
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── ROOT APP ─────────────────────────────────────────────────────────────────
function PronunciationApp() {
  const [screen, setScreen] = useState("menu"); // menu | practice | eval
  const [selectedAge, setSelectedAge] = useState(null);
  const [apiReady, setApiReady] = useState(false);

  useEffect(() => {
    loadApiKey().then(() => { setApiReady(!!GEMINI_API_KEY); });
    // Pre-load voices
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => {};
  }, []);

  if (screen === "practice") {
    return <PracticeMode age={selectedAge} onExit={() => setScreen("menu")} />;
  }
  if (screen === "eval") {
    return <EvalMode age={selectedAge} onExit={() => setScreen("menu")} />;
  }
  return (
    <MainMenu
      apiReady={apiReady}
      onStart={(age, mode) => {
        setSelectedAge(age);
        setScreen(mode === "practice" ? "practice" : "eval");
      }}
    />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(PronunciationApp));
  </script>
</body>
</html>
